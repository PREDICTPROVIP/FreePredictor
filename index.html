<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Predictor Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@500;700&family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Default Theme */
            --bg-main: #0a0a0c;
            --bg-panel: #16181c;
            --accent-color: #00ff41;
            --accent-glow: rgba(0, 255, 65, 0.4);
            --text-main: #ffffff;
            --text-muted: #8b8d96;
            --cell-bg: rgba(255, 255, 255, 0.05);
            --cell-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #050505; color: var(--text-main); font-family: 'Inter', sans-serif;
            margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        #app-container {
            width: 100%; max-width: 430px; height: 100%; max-height: 900px;
            background: var(--bg-main); display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8); transition: background 0.3s ease;
        }

        @media (min-height: 850px) and (min-width: 450px) {
            #app-container { border-radius: 40px; height: 92vh; border: 8px solid #1f2029; overflow: hidden; }
        }

        .header {
            display: flex; justify-content: space-between; align-items: center; padding: 20px;
            background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); z-index: 10;
        }

        .brand-logo {
            font-family: 'Jura', sans-serif; font-weight: 700; font-size: 1.5rem;
            color: var(--accent-color); text-shadow: 0 0 10px var(--accent-glow); letter-spacing: 2px;
        }

        .balance-pill {
            background: var(--bg-panel); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; display: flex; gap: 8px;
        }

        .display-area {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            position: relative; padding: 20px; overflow-y: auto;
        }

        .game-badge {
            background: var(--bg-panel); border: 1px solid var(--accent-color); color: var(--text-main);
            padding: 4px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 800; letter-spacing: 1px;
            text-transform: uppercase; box-shadow: 0 0 15px var(--accent-glow); margin-bottom: 20px;
        }

        /* AVIATOR */
        .game-container { display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; min-height: 250px; }
        .game-container.active { display: flex; }

        .aviator-value {
            font-family: 'Share Tech Mono', monospace; font-size: 5rem; font-weight: 700; color: #fff;
            text-shadow: 0 0 30px var(--accent-glow), 0 0 10px var(--accent-color); transition: all 0.3s;
        }

            /* MINES */
        .mines-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; 
            width: 100%; max-width: 320px; aspect-ratio: 1; padding: 10px;
            background: var(--bg-panel); border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);
            margin: 0 auto;
        }
        .mine-cell {
            background: var(--cell-bg); border: 1px solid var(--cell-border); border-radius: 8px;
            display: flex; justify-content: center; align-items: center; font-size: 1.8rem; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden; aspect-ratio: 1;
        }
        .mine-cell.safe {
            background: rgba(0, 255, 65, 0.15); border-color: var(--accent-color);
            box-shadow: inset 0 0 15px rgba(0, 255, 65, 0.2); transform: scale(1.05);
        }
        .mine-cell.safe::after { content: '⭐'; animation: popIn 0.4s ease forwards; }

        /* APPLE OF FORTUNE */
        .apple-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 260px;
            background: var(--bg-panel); border-radius: 16px; padding: 15px; border: 1px solid rgba(255,255,255,0.05);
        }
        .apple-cell {
            aspect-ratio: 1; background: var(--cell-bg); border-radius: 6px; border: 1px solid var(--cell-border);
            display: flex; justify-content: center; align-items: center; transition: all 0.3s; font-size: 1.2rem;
        }
        .apple-cell.safe {
            background: rgba(0, 255, 65, 0.15); border-color: var(--accent-color); transform: scale(1.1);
        }
        .apple-cell.safe::after { content: '🍏'; animation: popIn 0.4s ease forwards; }

        /* PENALTY */
        .penalty-container {
            width: 100%; display: flex; flex-direction: column; gap: 15px; align-items: center; max-width: 320px; margin: 0 auto;
        }
        .penalty-step {
            width: 100%; background: var(--bg-panel); border: 1px solid var(--cell-border); border-radius: 12px;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; opacity: 0.5;
            transition: all 0.3s;
        }
        .penalty-step.active {
            opacity: 1; border-color: var(--accent-color); box-shadow: 0 0 20px rgba(0, 255, 65, 0.1); transform: scale(1.02);
        }
        .penalty-targets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 110px; }
        .p-ball {
            width: 30px; height: 30px; border-radius: 6px; border: 2px solid var(--cell-border);
            display: flex; justify-content: center; align-items: center; font-size: 0.9rem; background: var(--cell-bg);
        }
        .p-ball.empty { visibility: hidden; }
        .p-ball.target {
            border-color: var(--accent-color); background: var(--accent-color); color: #000; box-shadow: 0 0 10px var(--accent-glow);
            border-radius: 50%; animation: popIn 0.3s ease;
        }

        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }

        .terminal {
            width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px; height: 140px; padding: 15px; font-family: 'Share Tech Mono', monospace; font-size: 0.75rem;
            color: var(--text-muted); overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: auto;
        }
        .terminal-line.active { color: var(--accent-color); text-shadow: 0 0 5px var(--accent-glow); }
        .terminal-line.error { color: #ff3366; }

            .btn-primary {
            width: 100%; background: var(--accent-color); color: #000; border: none; border-radius: 16px; padding: 22px;
            font-size: 1.3rem; font-weight: 800; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; box-shadow: 0 0 30px var(--accent-glow); transition: all 0.2s; position: relative; overflow: hidden;
        }
        .btn-primary:active { transform: scale(0.96); }
