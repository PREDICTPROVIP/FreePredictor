<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Predictor Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@500;700&family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Default Theme */
            --bg-main: #0a0a0c;
            --bg-panel: #16181c;
            --accent-color: #00ff41;
            --accent-glow: rgba(0, 255, 65, 0.4);
            --text-main: #ffffff;
            --text-muted: #8b8d96;
            --cell-bg: rgba(255, 255, 255, 0.05);
            --cell-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #050505; color: var(--text-main); font-family: 'Inter', sans-serif;
            margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        #app-container {
            width: 100%; max-width: 430px; height: 100%; max-height: 900px;
            background: var(--bg-main); display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8); transition: background 0.3s ease;
        }

        @media (min-height: 850px) and (min-width: 450px) {
            #app-container { border-radius: 40px; height: 92vh; border: 8px solid #1f2029; overflow: hidden; }
        }

        .header {
            display: flex; justify-content: space-between; align-items: center; padding: 20px;
            background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); z-index: 10;
        }

        .brand-logo {
            font-family: 'Jura', sans-serif; font-weight: 700; font-size: 1.5rem;
            color: var(--accent-color); text-shadow: 0 0 10px var(--accent-glow); letter-spacing: 2px;
        }

        .balance-pill {
            background: var(--bg-panel); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; display: flex; gap: 8px;
        }

        .display-area {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            position: relative; padding: 20px; overflow-y: auto;
        }

        .game-badge {
            background: var(--bg-panel); border: 1px solid var(--accent-color); color: var(--text-main);
            padding: 4px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 800; letter-spacing: 1px;
            text-transform: uppercase; box-shadow: 0 0 15px var(--accent-glow); margin-bottom: 20px;
        }

        /* AVIATOR */
        .game-container { display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; min-height: 250px; }
        .game-container.active { display: flex; }

        .aviator-value {
            font-family: 'Share Tech Mono', monospace; font-size: 5rem; font-weight: 700; color: #fff;
            text-shadow: 0 0 30px var(--accent-glow), 0 0 10px var(--accent-color); transition: all 0.3s;
        }

        /* MINES */
        .mines-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; 
            width: 100%; max-width: 320px; aspect-ratio: 1; padding: 10px;
            background: var(--bg-panel); border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);
            margin: 0 auto;
        }
        .mine-cell {
            background: var(--cell-bg); border: 1px solid var(--cell-border); border-radius: 8px;
            display: flex; justify-content: center; align-items: center; font-size: 1.8rem; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden; aspect-ratio: 1;
        }
        .mine-cell.safe {
            background: rgba(0, 255, 65, 0.15); border-color: var(--accent-color);
            box-shadow: inset 0 0 15px rgba(0, 255, 65, 0.2); transform: scale(1.05);
        }
        .mine-cell.safe::after { content: '⭐'; animation: popIn 0.4s ease forwards; }

        /* APPLE OF FORTUNE */
        .apple-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 260px;
            background: var(--bg-panel); border-radius: 16px; padding: 15px; border: 1px solid rgba(255,255,255,0.05);
        }
        .apple-cell {
            aspect-ratio: 1; background: var(--cell-bg); border-radius: 6px; border: 1px solid var(--cell-border);
            display: flex; justify-content: center; align-items: center; transition: all 0.3s; font-size: 1.2rem;
        }
        .apple-cell.safe {
            background: rgba(0, 255, 65, 0.15); border-color: var(--accent-color); transform: scale(1.1);
        }
        .apple-cell.safe::after { content: '🍏'; animation: popIn 0.4s ease forwards; }

        /* PENALTY */
        .penalty-container {
            width: 100%; display: flex; flex-direction: column; gap: 15px; align-items: center; max-width: 320px; margin: 0 auto;
        }
        .penalty-step {
            width: 100%; background: var(--bg-panel); border: 1px solid var(--cell-border); border-radius: 12px;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; opacity: 0.5;
            transition: all 0.3s;
        }
        .penalty-step.active {
            opacity: 1; border-color: var(--accent-color); box-shadow: 0 0 20px rgba(0, 255, 65, 0.1); transform: scale(1.02);
        }
        .penalty-targets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 110px; }
        .p-ball {
            width: 30px; height: 30px; border-radius: 6px; border: 2px solid var(--cell-border);
            display: flex; justify-content: center; align-items: center; font-size: 0.9rem; background: var(--cell-bg);
        }
        .p-ball.empty { visibility: hidden; }
        .p-ball.target {
            border-color: var(--accent-color); background: var(--accent-color); color: #000; box-shadow: 0 0 10px var(--accent-glow);
            border-radius: 50%; animation: popIn 0.3s ease;
        }

        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }

        .terminal {
            width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px; height: 140px; padding: 15px; font-family: 'Share Tech Mono', monospace; font-size: 0.75rem;
            color: var(--text-muted); overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: auto;
        }
        .terminal-line.active { color: var(--accent-color); text-shadow: 0 0 5px var(--accent-glow); }
        .terminal-line.error { color: #ff3366; }

        .btn-primary {
            width: 100%; background: var(--accent-color); color: #000; border: none; border-radius: 16px; padding: 22px;
            font-size: 1.3rem; font-weight: 800; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; box-shadow: 0 0 30px var(--accent-glow); transition: all 0.2s; position: relative; overflow: hidden;
        }
        .btn-primary:active { transform: scale(0.96); }
        .btn-primary:disabled { background: var(--bg-panel); color: #555; box-shadow: none; border: 1px solid rgba(255,255,255,0.1); }

        #admin-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px); z-index: 9999; display: none; flex-direction: column; padding: 20px; overflow-y: auto;
        }
        .admin-card { background: #111; border: 1px solid #333; border-radius: 20px; padding: 20px; margin-top: 20px; margin-bottom: 40px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
        .form-control {
            width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 1rem;
        }
        .form-control:focus { outline: none; border-color: var(--accent-color); }
        select.form-control { appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right .7rem top 50%; background-size: .65rem auto; }
        textarea.form-control { height: 80px; resize: none; font-family: 'Share Tech Mono', monospace; }
        .btn-admin { background: #fff; color: #000; padding: 15px; border-radius: 10px; border: none; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Секретный триггер на бренде (5 кликов) -->
    <header class="header">
        <div id="secret-trigger" class="brand-logo" style="cursor:pointer;">
            <span id="ui-brand-name">1XBET</span> <span style="font-size: 0.5em; opacity: 0.5;">PRO</span>
        </div>
        <div class="balance-pill">
            <span id="ui-balance-val">24,500</span>
            <span id="ui-currency" class="text-gray-400">RUB</span>
        </div>
    </header>

    <div class="display-area">
        <div class="game-badge" id="ui-game-name">AVIATOR</div>
        
        <!-- AVIATOR -->
        <div id="engine-aviator" class="game-container active">
            <div id="display-value" class="aviator-value">WAIT</div>
        </div>

        <!-- MINES -->
        <div id="engine-mines" class="game-container">
            <div class="mines-grid" id="mines-grid">
                <!-- 25 ячеек генерируются через JS -->
            </div>
        </div>

        <!-- APPLE OF FORTUNE -->
        <div id="engine-apple" class="game-container">
            <div class="apple-grid" id="apple-grid">
                <!-- 25 ячеек (5 рядов) генерируются через JS снизу вверх -->
            </div>
        </div>

        <!-- PENALTY -->
        <div id="engine-penalty" class="game-container">
            <div class="penalty-container" id="penalty-container">
                <!-- Шаги генерируются через JS -->
            </div>
        </div>

        <div class="terminal" id="terminal"></div>
    </div>

    <div class="p-5 pb-8">
        <button id="btn-predict" class="btn-primary">GET SIGNAL</button>
    </div>

    <div id="admin-panel">
        <div class="flex justify-between items-center text-white mb-2 mt-4">
            <h2 class="text-xl font-bold font-['Jura'] text-red-500">CREATOR STUDIO</h2>
            <button id="btn-close-admin" class="text-gray-400 p-2 text-2xl">&times;</button>
        </div>
        
        <div class="admin-card">
            <div class="form-group">
                <label>Бренд (Дизайн)</label>
                <select id="cfg-product" class="form-control">
                    <option value="1xbet">1xBet</option>
                    <option value="1win">1Win</option>
                    <option value="betandyou">BetAndYou</option>
                </select>
            </div>

            <div class="form-group">
                <label>Игра</label>
                <select id="cfg-game" class="form-control">
                    <option value="Aviator">Aviator (Crash)</option>
                    <option value="Mines">Mines (Мины)</option>
                    <option value="Apple">Apple of Fortune</option>
                    <option value="Penalty">Penalty (Пенальти)</option>
                </select>
            </div>

            <div class="form-group">
                <label>ГЕО + Валюта</label>
                <select id="cfg-geo" class="form-control"></select>
            </div>

            <div class="form-group">
                <label>Язык интерфейса</label>
                <select id="cfg-lang" class="form-control">
                    <option value="en">English</option>
                    <option value="ru">Русский</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="ar">العربية</option>
                </select>
            </div>

            <div class="form-group">
                <label>Баланс (Фейк)</label>
                <input type="text" id="cfg-balance" class="form-control" value="24500.50">
            </div>

            <!-- Специфичные настройки (меняются от игры) -->
            <div id="aviator-settings" class="form-group mt-6">
                <label class="text-white">Очередь коэффициентов (Aviator)</label>
                <textarea id="cfg-queue" class="form-control">1.45, 2.30, 11.50, 1.05</textarea>
                <button id="btn-reset-queue" class="mt-2 text-xs text-red-500 border border-red-900 rounded px-3 py-1">Сбросить очередь на начало</button>
            </div>

            <div id="ai-settings" class="form-group mt-6 hidden bg-gray-900 p-4 rounded-lg border border-gray-700">
                <p class="text-sm text-green-400 font-bold mb-1">AI Pattern Generator Активен</p>
                <p class="text-xs text-gray-400">Для сеточных игр (Мины, Яблоки, Пенальти) безопасные ячейки генерируются алгоритмом автоматически при каждом нажатии.</p>
            </div>

            <button id="btn-save-admin" class="btn-admin mt-4" style="background: var(--accent-color);">ПРИМЕНИТЬ</button>
        </div>
    </div>
</div>

<script>
    // --- DICTIONARIES ---
    const PRODUCTS = {
        '1xbet': { name: '1XBET', color: '#1e88e5', bg: '#0b1a2a', panel: '#112740' },
        '1win': { name: '1WIN', color: '#0077ff', bg: '#0a0e17', panel: '#131b2c' },
        'betandyou': { name: 'BETANDYOU', color: '#ffcc00', bg: '#111111', panel: '#1e1e1e' }
    };

    const GEOS = [
        { id: 'zm', name: 'Zambia', cur: 'ZMW', lang: 'en' }, { id: 'gh', name: 'Ghana', cur: 'GHS', lang: 'en' },
        { id: 'ci', name: 'Ivory Coast', cur: 'XOF', lang: 'fr' }, { id: 'ke', name: 'Kenya', cur: 'KES', lang: 'en' },
        { id: 'cd', name: 'Congo (DRC)', cur: 'CDF', lang: 'fr' }, { id: 'bf', name: 'Burkina Faso', cur: 'XOF', lang: 'fr' },
        { id: 'ug', name: 'Uganda', cur: 'UGX', lang: 'en' }, { id: 'tz', name: 'Tanzania', cur: 'TZS', lang: 'en' },
        { id: 'sn', name: 'Senegal', cur: 'XOF', lang: 'fr' }, { id: 'cm', name: 'Cameroon', cur: 'XAF', lang: 'fr' },
        { id: 'ng', name: 'Nigeria', cur: 'NGN', lang: 'en' }, { id: 'dz', name: 'Algeria', cur: 'DZD', lang: 'ar' },
        { id: 'eg', name: 'Egypt', cur: 'EGP', lang: 'ar' }, { id: 'ma', name: 'Morocco', cur: 'MAD', lang: 'ar' },
        { id: 'in', name: 'India', cur: 'INR', lang: 'en' }, { id: 'my', name: 'Malaysia', cur: 'MYR', lang: 'en' },
        { id: 'co', name: 'Colombia', cur: 'COP', lang: 'es' }, { id: 'cl', name: 'Chile', cur: 'CLP', lang: 'es' },
        { id: 'pe', name: 'Peru', cur: 'PEN', lang: 'es' }, { id: 'ar', name: 'Argentina', cur: 'ARS', lang: 'es' },
        { id: 'mx', name: 'Mexico', cur: 'MXN', lang: 'es' }, { id: 'bd', name: 'Bangladesh', cur: 'BDT', lang: 'en' }
    ];

    const I18N = {
        'en': { wait: "WAIT", predict: "GET SIGNAL", logs: ["[SYS] Connecting...", "[+] Handshake OK", "[!] Bypassing RNG...", "[+] Decrypted"] },
        'ru': { wait: "ОЖИДАНИЕ", predict: "ПОЛУЧИТЬ СИГНАЛ", logs: ["[SYS] Подключение...", "[+] Доступ открыт", "[!] Обход ГСЧ...", "[+] Успех"] },
        'es': { wait: "ESPERAR", predict: "OBTENER SEÑAL", logs: ["[SYS] Conectando...", "[+] Acceso concedido", "[!] Bypass RNG...", "[+] Éxito"] },
        'fr': { wait: "ATTENDRE", predict: "OBTENIR SIGNAL", logs: ["[SYS] Connexion...", "[+] Accès autorisé", "[!] Contournement...", "[+] Succès"] },
        'ar': { wait: "انتظار", predict: "الحصول على إشارة", logs: ["[SYS] متصل...", "[+] تم الوصول", "[!] تجاوز...", "[+] نجاح"] }
    };

    // --- STATE ---
    let state = {
        product: '1xbet', game: 'Aviator', geo: 'ng', lang: 'en', balance: '24500.50',
        queue: [1.45, 2.30, 11.50, 1.05], queueIndex: 0, isProcessing: false
    };

    // --- DOM ---
    const ui = {
        root: document.documentElement,
        brandName: document.getElementById('ui-brand-name'), gameName: document.getElementById('ui-game-name'),
        balanceVal: document.getElementById('ui-balance-val'), currency: document.getElementById('ui-currency'),
        btnPredict: document.getElementById('btn-predict'), terminal: document.getElementById('terminal'),
        secretTrigger: document.getElementById('secret-trigger'), adminPanel: document.getElementById('admin-panel'),
        
        // Games
        games: {
            Aviator: document.getElementById('engine-aviator'),
            Mines: document.getElementById('engine-mines'),
            Apple: document.getElementById('engine-apple'),
            Penalty: document.getElementById('engine-penalty')
        },
        aviatorVal: document.getElementById('display-value'),
        minesGrid: document.getElementById('mines-grid'),
        appleGrid: document.getElementById('apple-grid'),
        penaltyGrid: document.getElementById('penalty-container')
    };

    // --- STREAMING_CHUNK:Initialization ---
    function init() {
        // Заполняем ГЕО
        const geoSelect = document.getElementById('cfg-geo');
        GEOS.sort((a,b) => a.name.localeCompare(b.name)).forEach(g => {
            geoSelect.add(new Option(`${g.name} (${g.cur})`, g.id));
        });
        geoSelect.value = state.geo;

        // Триггер админки (5 тапов)
        let clicks = 0, timer;
        ui.secretTrigger.addEventListener('click', () => {
            clicks++; clearTimeout(timer); timer = setTimeout(() => clicks = 0, 1500);
            if (clicks >= 5) { document.getElementById('admin-panel').style.display = 'flex'; clicks = 0; }
        });

        // Слушатели админки
        document.getElementById('btn-close-admin').onclick = () => ui.adminPanel.style.display = 'none';
        document.getElementById('btn-save-admin').onclick = saveAdmin;
        document.getElementById('cfg-game').addEventListener('change', (e) => {
            const isAvi = e.target.value === 'Aviator';
            document.getElementById('aviator-settings').classList.toggle('hidden', !isAvi);
            document.getElementById('ai-settings').classList.toggle('hidden', isAvi);
        });
        document.getElementById('btn-reset-queue').onclick = () => { state.queueIndex = 0; alert("Очередь сброшена"); };
        
        ui.btnPredict.onclick = processPrediction;

        applyTheme();
    }

    function saveAdmin() {
        state.product = document.getElementById('cfg-product').value;
        state.game = document.getElementById('cfg-game').value;
        state.geo = document.getElementById('cfg-geo').value;
        state.lang = document.getElementById('cfg-lang').value;
        state.balance = document.getElementById('cfg-balance').value;
        
        if (state.game === 'Aviator') {
            const raw = document.getElementById('cfg-queue').value;
            state.queue = raw.split(',').map(s => parseFloat(s.trim().replace(',', '.'))).filter(n => !isNaN(n));
        }

        ui.adminPanel.style.display = 'none';
        applyTheme();
    }

    // --- STREAMING_CHUNK:Core Engine ---
    function applyTheme() {
        const prod = PRODUCTS[state.product];
        const geo = GEOS.find(g => g.id === state.geo);
        const lang = I18N[state.lang];

        ui.root.style.setProperty('--accent-color', prod.color);
        ui.root.style.setProperty('--accent-glow', `rgba(${hexToRgb(prod.color)}, 0.4)`);
        ui.root.style.setProperty('--bg-main', prod.bg);
        ui.root.style.setProperty('--bg-panel', prod.panel);

        ui.brandName.textContent = prod.name;
        ui.gameName.textContent = state.game.toUpperCase();
        ui.btnPredict.textContent = lang.predict;
        
        const bal = parseFloat(state.balance);
        ui.balanceVal.textContent = isNaN(bal) ? state.balance : bal.toLocaleString('en-US');
        ui.currency.textContent = geo ? geo.cur : 'USD';

        // Переключение движков
        Object.keys(ui.games).forEach(k => ui.games[k].classList.remove('active'));
        ui.games[state.game].classList.add('active');

        // Сброс состояния игры
        resetGameUI();
        
        ui.terminal.innerHTML = '';
        addLog(`> SYSTEM START [${prod.name} | ${state.game}]`, true);
        addLog(`> GEO: ${geo.name} | LANG: ${state.lang.toUpperCase()}`);
        addLog(`> READY.`, true);
    }

    function hexToRgb(hex) {
        let r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return r ? `${parseInt(r[1], 16)}, ${parseInt(r[2], 16)}, ${parseInt(r[3], 16)}` : '0, 255, 65';
    }

    function addLog(text, isHighlight = false) {
        const el = document.createElement('div');
        el.className = `terminal-line ${isHighlight ? 'active' : ''}`;
        el.innerHTML = `<span style="opacity:0.5">[${new Date().toLocaleTimeString('en-US',{hour12:false})}]</span> ${text}`;
        ui.terminal.appendChild(el);
        ui.terminal.scrollTop = ui.terminal.scrollHeight;
    }

    // --- STREAMING_CHUNK:Prediction Logics ---
    function resetGameUI() {
        if(state.game === 'Aviator') {
            ui.aviatorVal.textContent = I18N[state.lang].wait;
            ui.aviatorVal.style.opacity = 0.5;
        } else if (state.game === 'Mines') {
            ui.minesGrid.innerHTML = Array(25).fill('<div class="mine-cell"></div>').join('');
        } else if (state.game === 'Apple') {
            ui.appleGrid.innerHTML = Array(25).fill('<div class="apple-cell"></div>').join('');
        } else if (state.game === 'Penalty') {
            ui.penaltyGrid.innerHTML = ''; // Очищаем
        }
    }

    function processPrediction() {
        if (state.isProcessing) return;
        state.isProcessing = true;
        ui.btnPredict.disabled = true;
        
        resetGameUI();
        ui.terminal.innerHTML = '';
        
        let step = 0;
        
        // Генерация мощных динамических логов
        const hex = () => Math.random().toString(16).substr(2, 8).toUpperCase();
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1) + min);
        
        let logs = [];
        if (state.lang === 'ru') {
            logs = [
                `[SYS] Сканирование портов 443...`,
                `[+] Обход WAF Cloudflare: SUCCESS`,
                `[!] Инжект эксплойта в WebSocket...`,
                `[~] Дамп пакетов: ${rand(2000, 9999)} SHA-256`,
                `[*] Дешифровка сида [0x${hex()}]...`,
                `[+] Доступ к API ГСЧ получен`,
                `[SYS] Рендер паттерна...`
            ];
        } else {
             logs = [
                `[SYS] Scanning 443 ports...`,
                `[+] WAF Cloudflare bypass: SUCCESS`,
                `[!] WebSocket exploit injection...`,
                `[~] Dumping packets: ${rand(2000, 9999)} SHA-256`,
                `[*] Decrypting seed [0x${hex()}]...`,
                `[+] RNG API access granted`,
                `[SYS] Rendering pattern...`
            ];
        }
        
        const intv = setInterval(() => {
            if (step < logs.length) {
                addLog(logs[step], step === logs.length - 1);
                step++;
            } else {
                clearInterval(intv);
                showResult();
            }
        }, 300); // Ускоренная отрисовка логов
    }

    function showResult() {
        if (state.game === 'Aviator') {
            let val = "1.00";
            if (state.queueIndex < state.queue.length) {
                val = state.queue[state.queueIndex].toFixed(2);
                state.queueIndex++;
            } else {
                val = (Math.random() * 5 + 1.1).toFixed(2); // Random fallback
            }
            ui.aviatorVal.textContent = val + "x";
            ui.aviatorVal.style.opacity = 1;
            ui.aviatorVal.style.transform = 'scale(1.2)';
            setTimeout(() => ui.aviatorVal.style.transform = 'scale(1)', 200);
            
        } else if (state.game === 'Mines') {
            // Выбираем 4-6 рандомных ячеек
            const cells = ui.minesGrid.children;
            const count = Math.floor(Math.random() * 3) + 4; 
            let picked = new Set();
            while(picked.size < count) picked.add(Math.floor(Math.random() * 25));
            
            let delay = 0;
            picked.forEach(idx => {
                setTimeout(() => cells[idx].classList.add('safe'), delay);
                delay += 150;
            });
            
        } else if (state.game === 'Apple') {
            // 5 рядов, снизу вверх. Ряд = 5 ячеек.
            const cells = ui.appleGrid.children; 
            let delay = 0;
            for(let row = 4; row >= 0; row--) {
                const safeCol = Math.floor(Math.random() * 5);
                const idx = (row * 5) + safeCol;
                setTimeout(() => cells[idx].classList.add('safe'), delay);
                delay += 250;
            }
            
        } else if (state.game === 'Penalty') {
            ui.penaltyGrid.innerHTML = '';
            
            // 3 шага пенальти
            for(let i=0; i<3; i++) {
                // 5 позиций: 0:Л-Верх, 1:П-Верх, 2:Л-Низ, 3:Центр, 4:П-Низ
                const targetId = Math.floor(Math.random() * 5); 
                
                // Массив для сетки ворот (3x2)
                // [0=Л-В] [empty] [1=П-В]
                // [2=Л-Н] [3=Цен] [4=П-Н]
                let c = Array(5).fill(false);
                c[targetId] = true;

                const div = document.createElement('div');
                div.className = 'penalty-step';
                div.innerHTML = `
                    <span style="font-family:'Jura'; font-weight:700; font-size: 1.1rem; width: 65px;">STEP ${i+1}</span>
                    <div class="penalty-targets">
                        <div class="p-ball ${c[0] ? 'target' : ''}">${c[0] ? '⚽' : ''}</div>
                        <div class="p-ball empty"></div>
                        <div class="p-ball ${c[1] ? 'target' : ''}">${c[1] ? '⚽' : ''}</div>
                        <div class="p-ball ${c[2] ? 'target' : ''}">${c[2] ? '⚽' : ''}</div>
                        <div class="p-ball ${c[3] ? 'target' : ''}">${c[3] ? '⚽' : ''}</div>
                        <div class="p-ball ${c[4] ? 'target' : ''}">${c[4] ? '⚽' : ''}</div>
                    </div>
                `;
                ui.penaltyGrid.appendChild(div);
                
                setTimeout(() => {
                    div.classList.add('active');
                }, i * 400);
            }
        }

        setTimeout(() => {
            ui.btnPredict.disabled = false;
            state.isProcessing = false;
        }, 1000);
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
